<svg xmlns="http://www.w3.org/2000/svg" width="280" height="100" viewBox="0 0 280 100" fill="none" aria-labelledby="logoTitle logoDesc" role="img">
  <title id="logoTitle">Venue Buka logo</title>
  <desc id="logoDesc">Artistic logo with VenBuk split by a teal circle, and tagline venue booking with ease centered below.</desc>
  <defs>
    <linearGradient id="circleFill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#168a8f"/>
      <stop offset="100%" stop-color="#0b4d51"/>
    </linearGradient>
    <linearGradient id="circleRing" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFD66B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b0f1f" flood-opacity="0.15"/>
    </filter>
    <filter id="textGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Central teal circle with gold ring -->
  <g filter="url(#logoShadow)">
    <!-- Gold outer ring -->
    <circle cx="140" cy="35" r="22" fill="none" stroke="url(#circleRing)" stroke-width="2"/>
    <!-- Teal gradient circle -->
    <circle cx="140" cy="35" r="19" fill="url(#circleFill)"/>
    <!-- Subtle highlight on circle -->
    <circle cx="135" cy="30" r="6" fill="rgba(255,255,255,0.15)"/>
  </g>

  <!-- Left text: "Ven" -->
  <text x="55" y="45" font-family="'Playfair Display', serif" font-size="26" font-weight="700" fill="#ffffff" filter="url(#textGlow)" letter-spacing="-0.5">
    Ven
  </text>

  <!-- Right text: "Buk" -->
  <text x="172" y="45" font-family="'Playfair Display', serif" font-size="26" font-weight="700" fill="#f2d675" filter="url(#textGlow)" letter-spacing="-0.5">
    Buk
  </text>

  <!-- Decorative dots on circle -->
  <circle cx="140" cy="18" r="1.5" fill="#FFD66B" opacity="0.8"/>
  <circle cx="140" cy="52" r="1.5" fill="#FFD66B" opacity="0.8"/>

  <!-- Tagline centered below -->
  <text x="140" y="80" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#c7e4e2" text-anchor="middle">
    venue booking with ease
  </text>
</svg>
